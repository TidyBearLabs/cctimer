<!-- Where: Electron renderer HTML. What: timer popover shell. Why: display Claude Code reset data from the menu bar. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cctimer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Claude Code</h1>
        <div class="badge">5h</div>
      </header>

      <section class="timer" aria-label="5-hour rate limit">
        <div class="remaining" data-remaining>--:--:--</div>
        <div class="meters" aria-hidden="true">
          <div class="meterRow">
            <span>5h</span>
            <div class="meter">
              <div class="meterFill" data-bar></div>
            </div>
          </div>
          <div class="meterRow">
            <span>7d</span>
            <div class="meter">
              <div class="meterFill meterFillSubtle" data-seven-day-bar></div>
            </div>
          </div>
        </div>
      </section>

      <dl class="stats">
        <div>
          <dt>Usage</dt>
          <dd data-used>--%</dd>
        </div>
        <div>
          <dt>Reset time</dt>
          <dd data-reset>Unavailable</dd>
        </div>
        <div>
          <dt>Weekly usage</dt>
          <dd data-seven-day-used>--%</dd>
        </div>
        <div>
          <dt>Weekly reset</dt>
          <dd data-seven-day-reset>Unavailable</dd>
        </div>
        <div class="statsMeta">
          <dt>Last updated</dt>
          <dd data-updated>Unavailable</dd>
        </div>
      </dl>

      <section class="setup">
        <span data-setup-status>Checking</span>
        <button type="button" data-setup-button>Setup</button>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
